<div class="mu">${esc(s.time||'')} · ${esc(s.venue||'Lokasi belum diisi')}${s.note?'<br>'+esc(s.note):''}</div>

function mt(m){

function klas(){

async function gen(sid){
  const s=S.find(x=>x.id===sid),hd=s.hadir||[],ms=M.filter(m=>m.sid===sid),busy=new Set();
  ms.filter(m=>m.st==='main').forEach(m=>nm(m).forEach(n=>busy.add(n)));
  const av=hd.filter(n=>!busy.has(n));
  if(av.length<4){alert(hd.length<4?'Minimal 4 pemain hadir untuk main 2 lawan 2.':'Pemain yang tersedia kurang dari 4 (sisanya sedang main).');return}
  const cn=Math.min(Math.max(parseInt(g('ct',1))||1,1),Math.floor(av.length/4)),cnt={};
  av.forEach(n=>cnt[n]=0);ms.filter(m=>m.st!=='next').forEach(m=>nm(m).forEach(n=>{if(n in cnt)cnt[n]++}));
  const pool=sh(av).sort((x,y)=>cnt[x]-cnt[y]),play=pool.slice(0,cn*4),rest=pool.slice(cn*4),tg=new Set();
  ms.forEach(m=>{tg.add(m.a.slice().sort().join('|'));tg.add(m.b.slice().sort().join('|'))});
  let best=null,bs=1e9;
  for(let t=0;t<40;t++){
    const q=sh(play),res=[];let sc=0;
    for(let c=0;c<cn;c++){
      const g4=q.slice(c*4,c*4+4),opts=[[[g4[0],g4[1]],[g4[2],g4[3]]],[[g4[0],g4[2]],[g4[1],g4[3]]],[[g4[0],g4[3]],[g4[1],g4[2]]]];
      let bo=null,bv=1e9;
      opts.forEach(o=>{const v=Math.abs(lvOf(o[0][0])+lvOf(o[0][1])-lvOf(o[1][0])-lvOf(o[1][1]))*10+o.filter(tt=>tg.has(tt.slice().sort().join('|'))).length*3+Math.random();if(v<bv){bv=v;bo=o}});
      res.push(bo);sc+=bv;
    }
    if(sc<bs){bs=sc;best=res}
  }
  const rnd=Math.max(0,...ms.map(m=>m.rnd||0))+1;
  await Promise.all(ms.filter(m=>m.st==='next').map(m=>db.doc('matches/'+m.id).delete()));
  for(let c=0;c<cn;c++){await db.collection('matches').add({sid,rnd,a:best[c][0],b:best[c][1],st:'next',sa:null,sb:null,note:'',rest,at:Date.now()+c})}
}
